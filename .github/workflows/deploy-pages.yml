name: Deploy site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Finds the game frontend's package.json wherever it actually landed
      # (uploads via GitHub's web UI have accidentally nested it one extra
      # level before, e.g. game/game/frontend instead of game/frontend) and
      # records its folder so every later step uses the real path instead of
      # a hardcoded guess.
      - name: Locate game frontend folder
        run: |
          MATCH=$(find . -path "*/game/frontend/package.json" -not -path "*/node_modules/*" | head -1)
          if [ -z "$MATCH" ]; then
            echo "Could not find a game/.../frontend/package.json anywhere in the repo."
            echo "--- full repo layout ---"
            find . -not -path "./.git/*" -not -path "*/node_modules/*"
            exit 1
          fi
          FRONTEND_DIR=$(dirname "$MATCH")
          echo "Found frontend at: $FRONTEND_DIR"
          echo "FRONTEND_DIR=$FRONTEND_DIR" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install game frontend dependencies
        run: npm ci
        working-directory: ${{ env.FRONTEND_DIR }}

      - name: Build game frontend
        run: npm run build
        working-directory: ${{ env.FRONTEND_DIR }}

      # Combine the static landing page (served at the domain root) with the
      # built game app (served at /play/, per DECISIONS.md "Build Phase 1
      # kickoff" — 4chits.com/play instead of a play.4chits.com subdomain,
      # because GitHub Pages only allows one custom domain per repo).
      - name: Assemble combined Pages site
        run: |
          mkdir -p site
          cp -r landing/. site/
          mkdir -p site/play
          cp -r "${FRONTEND_DIR}/dist/." site/play/

      - name: Upload combined site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
