name: Deploy site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: game/frontend/package-lock.json

      - name: Install game frontend dependencies
        run: npm ci
        working-directory: game/frontend

      - name: Build game frontend
        run: npm run build
        working-directory: game/frontend

      # Combine the static landing page (served at the domain root) with the
      # built game app (served at /play/, per DECISIONS.md "Build Phase 1
      # kickoff" — 4chits.com/play instead of a play.4chits.com subdomain,
      # because GitHub Pages only allows one custom domain per repo).
      - name: Assemble combined Pages site
        run: |
          mkdir -p site
          cp -r landing/. site/
          mkdir -p site/play
          cp -r game/frontend/dist/. site/play/

      - name: Upload combined site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
